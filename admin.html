<!doctype html><html lang="ro"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Administrare Maison D'Amira</title><style>body{font-family:Arial;margin:0;background:#120d08;color:white}.wrap{max-width:760px;margin:auto;padding:30px}.box{background:#fff;color:#211a17;padding:25px;border-radius:18px}input,textarea{width:100%;box-sizing:border-box;padding:12px;margin:7px 0 14px}button{padding:12px 20px;border:0;border-radius:22px;background:#b9914f;color:#fff;font-weight:bold}</style></head><body><div class="wrap"><a href="index.html" style="color:#f2d49b">← Produse</a><div class="box"><h1>Administrare produse</h1><p>🔐 Publicarea este acceptată doar de contul GitHub autorizat.</p><label>Nume</label><input id="name"><label>Preț</label><input id="price"><label>Categorie</label><input id="category" value="Parfumuri arăbești"><label>Descriere</label><textarea id="desc" rows="5"></textarea><label>Fotografia produsului</label><input id="photo" type="file" accept="image/*"><div id="photoName" style="margin:6px 0 14px;color:#756b63;font-size:14px">Nicio fotografie aleasă</div><input id="image" placeholder="sau introdu linkul imaginii"><button onclick="publish()">Trimite spre publicare</button></div></div><script>document.getElementById('photo').addEventListener('change',function(){document.getElementById('photoName').textContent=this.files[0]?this.files[0].name:'Nicio fotografie aleasă'});async function imageData(){const f=document.getElementById('photo').files[0];if(!f)return '';if(!f.type.startsWith('image/'))throw Error('Fișierul nu este o imagine.');const b=await createImageBitmap(f);const max=700,scale=Math.min(1,max/Math.max(b.width,b.height));const c=document.createElement('canvas');c.width=Math.max(1,Math.round(b.width*scale));c.height=Math.max(1,Math.round(b.height*scale));c.getContext('2d').drawImage(b,0,0,c.width,c.height);return c.toDataURL('image/jpeg',.55)};async function publish(){let n=document.getElementById('name').value.trim();if(!n)return alert('Completează numele.');let img=document.getElementById('image').value.trim();try{const uploaded=await imageData();if(uploaded)img=uploaded}catch(e){return alert(e.message)}let p={name:n,price:document.getElementById('price').value.trim(),image:img,category:document.getElementById('category').value.trim(),desc:document.getElementById('desc').value.trim()};let b='Actualizare produs Maison D’Amira.\n\n\`\`\`json\n'+JSON.stringify({action:'add',oldName:'',product:p},null,2)+'\n\`\`\`';location.href='https://github.com/mariusraducan873-netizen/Maison-D-amira/issues/new?title='+encodeURIComponent('[MAISON-PRODUCT] add '+n)+'&body='+encodeURIComponent(b)}</script></body></html>
